version: '3.8'

services:

  # Web Server Service
  nginx:
    container_name: nginx
    image: nginx:alpine
    ports:
      - "8080:80"
    depends_on:
      - app
      - db
    volumes:
      - ./src:/var/www
      - ./nginx/conf.d/:/etc/nginx/conf.d

  #Database Service
  db:
    container_name: mysql
    image: mysql
    ports:
      - "3307:3306"
    volumes:
      - ./mysql/data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: 'password'
      MYSQL_DATABASE: 'medical_db'
      MYSQL_USER: 'medical'
      MYSQL_PASSWORD: 'password'
      MYSQL_CHARSET: 'utf8mb4'
      MYSQL_COLLATION: 'utf8mb4_general_ci'

  # PhpMyAdmin Service
  phpmyadmin:
    container_name: phpmyadmin
    image: phpmyadmin/phpmyadmin
    ports:
      - "3400:80"
    depends_on:
      - db

  # Application Service
  app:
    container_name: medical-app
    build:
      context: ./php
      dockerfile: Dockerfile
    volumes:
      - ./src:/var/www
    ports:
      - "9000:9000"
    working_dir: /var/www

  # Redis
  redis:
    image: redis
    container_name: medical-redis
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf

  # Supervisor Service
  supervisor:
    container_name: medical-supervisor
    build:
      context: ./php
      dockerfile: Dockerfile
    image: medical-supervisor
    restart: unless-stopped
    working_dir: /var/www/
    volumes:
      - ./src:/var/www
      - ./supervisor/conf.d/:/etc/supervisor/conf.d
